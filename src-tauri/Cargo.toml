[package]
name = "kcode-native"
version = "1.0.0"
description = "Native cross-platform KCode app for Kimi Code"
authors = ["kaindrs"]
license = "MIT"
repository = "https://github.com/kaindrs/kcode-native"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "net", "io-util", "macros", "rt", "rt-multi-thread"] }
dirs = "5"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
